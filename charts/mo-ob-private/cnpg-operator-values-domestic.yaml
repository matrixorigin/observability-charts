# CloudNativePG Operator 0.29.0 / 1.30.0 国内镜像配置。
# Operator 是独立 Helm release，不属于 mo-ob-private release。
fullnameOverride: mo-ob-postgresql-operator

image:
  repository: ghcr.m.daocloud.io/cloudnative-pg/cloudnative-pg
  tag: 1.30.0
  pullPolicy: IfNotPresent
  # 国外原始地址：ghcr.io/cloudnative-pg/cloudnative-pg:1.30.0

config:
  clusterWide: false

replicaCount: 2

monitoring:
  podMonitorEnabled: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: cloudnative-pg
            app.kubernetes.io/instance: mo-ob-postgresql-operator
        topologyKey: kubernetes.io/hostname
