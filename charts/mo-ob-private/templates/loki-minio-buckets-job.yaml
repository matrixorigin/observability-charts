{{- $platform := index .Values "mo-ob-opensource" -}}
{{- $loki := $platform.loki -}}
{{- if and $platform.enabled $loki.enabled $loki.minio.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-loki-bucket-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: loki-bucket-bootstrap
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | quote }}
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki-bucket-bootstrap
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      {{- with $loki.minio.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: create-buckets
          image: "{{ $loki.minio.mcImage.repository }}:{{ $loki.minio.mcImage.tag }}"
          imagePullPolicy: {{ $loki.minio.mcImage.pullPolicy | default "IfNotPresent" }}
          command:
            - /bin/sh
            - -ec
            - |
              until mc alias set loki "$MINIO_ENDPOINT" "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "Waiting for embedded MinIO..."
                sleep 2
              done
              for bucket in "$LOKI_CHUNKS_BUCKET" "$LOKI_RULER_BUCKET" "$LOKI_ADMIN_BUCKET"; do
                mc mb --ignore-existing "loki/$bucket"
              done
          env:
            - name: MINIO_ENDPOINT
              value: {{ printf "http://%s" ($loki.minio.address | default (printf "%s-minio:9000" .Release.Name)) | quote }}
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-minio
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-minio
                  key: rootPassword
            - name: LOKI_CHUNKS_BUCKET
              value: {{ $loki.loki.storage.bucketNames.chunks | default "chunks" | quote }}
            - name: LOKI_RULER_BUCKET
              value: {{ $loki.loki.storage.bucketNames.ruler | default "ruler" | quote }}
            - name: LOKI_ADMIN_BUCKET
              value: {{ $loki.loki.storage.bucketNames.admin | default "admin" | quote }}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
{{- end }}
