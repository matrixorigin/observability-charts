customerSizingApproved: true

# Customer delivery defaults to the verified domestic mirror set. To use the
# foreign upstream registries, apply values-images-upstream.yaml after this
# file. Private registries must set imageSource=private and override every
# rendered image.
imageSource: domestic

# The CloudNativePG Cluster is opt-in so upgrading an existing release never
# creates a database unexpectedly. Install the operator as a separate release
# and wait for it to become ready before enabling this block.
postgresql:
  enabled: false
  cluster:
    # Delivery default. Override consistently when the customer uses another
    # dynamic ReadWriteOnce provisioner.
    storageClass: directpv-min-io
    imageName: >-
      ghcr.m.daocloud.io/cloudnative-pg/postgresql:17.10-202608030910-system-bookworm@sha256:8561d04754c2caf8ed203b52e96163a24ff045782ca726d01b01bbcb0649222c
    # Foreign upstream:
    # ghcr.io/cloudnative-pg/postgresql:17.10-202608030910-system-bookworm@sha256:8561d04754c2caf8ed203b52e96163a24ff045782ca726d01b01bbcb0649222c

mo-ob-opensource:
  enabled: true

  # Dashboards, rules and scrape integration are owned by the companion
  # ob-ops content Chart.
  alertrules:
    enabled: false

  # mo-ob-private uses Prometheus for this base profile. Keep the optional
  # VictoriaMetrics stack out of the customer installation.
  victoria-metrics-k8s-stack:
    enabled: false

  alloy:
    enabled: true
    serviceMonitor:
      enabled: false
    image:
      registry: "docker.m.daocloud.io"
      repository: grafana/alloy
      tag: v1.3.1
      # Foreign upstream: docker.io/grafana/alloy:v1.3.1
    configReloader:
      enabled: false
    alloy:
      resources: 
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 200m
          memory: 200Mi
  promtail:
    serviceMonitor:
      enabled: false
    image:
      registry: docker.m.daocloud.io
      repository: grafana/promtail
      tag: "2.8.4"
      # Foreign upstream: docker.io/grafana/promtail:2.8.4
    enabled: true
    resources:
      limits:
        cpu: "200m"
        memory: "200Mi"
      requests:
        cpu: "10m"
        memory: "20Mi"
  loki:
    global:
      # This is the kube-system Service name, not the DNS implementation name.
      # Some Kubespray clusters use coredns instead of kube-dns.
      dnsService: kube-dns
      dnsNamespace: kube-system
      clusterDomain: cluster.local
    lokiCanary:
      enabled: false
    sidecar: 
      image:
        repository: docker.m.daocloud.io/kiwigrid/k8s-sidecar
        tag: 1.27.5
        # Foreign upstream: docker.io/kiwigrid/k8s-sidecar:1.27.5
    enabled: true
    monitoring:
      dashboards:
        # Platform dashboards and rules are owned by the ob-ops integration Chart.
        enabled: false
      rules:
        enabled: false
      serviceMonitor:
        enabled: false
    tableManager:
      # TSDB v13 uses the compactor for retention instead of table-manager.
      enabled: false
    # Object storage is an external dependency. This chart never installs
    # MinIO; provide the existing S3/MinIO endpoint and bucket at install time.
    minio:
      enabled: false
    memberlist:
      service:
        # Make member discovery resolvable while Loki pods are becoming ready.
        publishNotReadyAddresses: true
    # loki monolithic mode
    # singleBinary:
    #   replicas: 2
    loki:
      image:
        registry: docker.m.daocloud.io
        repository: grafana/loki
        tag: "3.2.0"
        # Foreign upstream: docker.io/grafana/loki:3.2.0
      # disable log alert in paivate env
      rulerConfig: 
        storage: 
          type: ""
        # The bundled base does not run Loki alert rules.
        alertmanager_url: ""
      commonConfig:
        replication_factor: 1
      storage_config:
        object_prefix: loki-controlplane
        # Use the namespace-local service name. This avoids proxy DNS fake-IP
        # answers for generated cluster FQDNs and remains namespace-independent.
        boltdb_shipper:
          index_gateway_client:
            server_address: dns+loki-backend-headless:9095
        tsdb_shipper:
          index_gateway_client:
            server_address: dns+loki-backend-headless:9095
      storage:
        bucketNames:
          # These placeholders are expanded by Loki at runtime from the
          # namespace-local mo-ob-loki-s3 Secret.
          chunks: ${LOKI_S3_BUCKET}
          ruler: ${LOKI_S3_BUCKET}
          admin: ${LOKI_S3_BUCKET}
        type: s3
        s3:
          endpoint: ${LOKI_S3_ENDPOINT}
          accessKeyId: ${LOKI_S3_ACCESS_KEY}
          secretAccessKey: ${LOKI_S3_SECRET_KEY}
          s3ForcePathStyle: ${LOKI_S3_FORCE_PATH_STYLE}
          insecure: ${LOKI_S3_INSECURE}
      schemaConfig:
        configs:
          - from: "2024-01-01"
            index:
              period: 24h
              prefix: index_
            object_store: s3
            schema: v13
            store: tsdb
      limits_config:
        retention_period: 720h
      compactor:
        retention_enabled: true
        delete_request_store: s3
    write:
      # -- Number of replicas for the write
      replicas: 1
      extraArgs:
        - -config.expand-env=true
      extraEnvFrom:
        - secretRef:
            name: mo-ob-loki-s3
      persistence:
        enableStatefulSetAutoDeletePVC: false
        storageClass: directpv-min-io
        size: 10Gi
      resources:
        requests:
          memory: "1Gi"
          cpu: "250m"
        limits:
          memory: "1Gi"
          cpu: "1000m"

    read:
      replicas: 1
      extraArgs:
        - -config.expand-env=true
      extraEnvFrom:
        - secretRef:
            name: mo-ob-loki-s3
      persistence:
        enableStatefulSetAutoDeletePVC: true
        storageClass: directpv-min-io
        size: 10Gi
      resources:
        requests:
          memory: "3Gi"
          cpu: "250m"
        limits:
          memory: "3Gi"
          cpu: "1000m"

    backend:
      replicas: 1
      extraArgs:
        - -config.expand-env=true
      extraEnvFrom:
        - secretRef:
            name: mo-ob-loki-s3
      # The base stack does not use the legacy alertmanager-loki-credentials
      # Secret. Notification integrations are installed separately.
      extraVolumeMounts: []
      extraVolumes: []
      persistence:
        enableStatefulSetAutoDeletePVC: true
        storageClass: directpv-min-io
        size: 10Gi
      resources:
        requests:
          memory: "250Mi"
          cpu: "200m"
        limits:
          memory: "250Mi"
          cpu: "200m"

    # Configuration for the gateway
    gateway:
      image:
        registry: docker.m.daocloud.io
        repository: nginxinc/nginx-unprivileged
        tag: 1.27-alpine
        # Foreign upstream: docker.io/nginxinc/nginx-unprivileged:1.27-alpine
      enabled: true
      service:
        labels:
          prometheus.io/service-monitor: "false"
      replicas: 1
      deploymentStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
      resources:
        requests:
          memory: "250Mi"
          cpu: "250m"
        limits:
          memory: "1Gi"
          cpu: "1000m"

  kube-prometheus-stack:
    enabled: true
    defaultRules:
      # K8s rules are installed and lifecycle-managed by the ob-ops content Chart.
      create: false
    grafana:
      enabled: false
      # Grafana is provided by mo-ruler-stack. Dashboard ConfigMaps are supplied
      # by ob-ops so this base release must not create a second copy.
      forceDeployDashboards: false

    coreDns:
      enabled: false

    kubeApiServer:
      enabled: false

    kubelet:
      enabled: false

    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    kubeScheduler:
      enabled: false

    prometheus-node-exporter: 
      image:
        registry: quay.m.daocloud.io
        repository: prometheus/node-exporter
        tag: v1.5.0
        # Foreign upstream: quay.io/prometheus/node-exporter:v1.5.0
      enabled: true
      service:
        annotations:
          prometheus.io/scrape: "false"
      prometheus:
        monitor:
          enabled: false
      resources: 
        limits: 
          cpu:    "200m"
          memory: "100Mi"
        requests: 
          cpu:    "10m"
          memory: "20Mi"
    
    prometheusOperator:
      serviceMonitor:
        selfMonitor: false
      image: 
        registry: quay.m.daocloud.io
        repository: prometheus-operator/prometheus-operator
        tag: v0.63.0
        # Foreign upstream: quay.io/prometheus-operator/prometheus-operator:v0.63.0
      prometheusConfigReloader: 
        image:
          registry: quay.m.daocloud.io
          repository: prometheus-operator/prometheus-config-reloader
          # if not set appVersion field from Chart.yaml is used
          tag: v0.63.0
          # Foreign upstream: quay.io/prometheus-operator/prometheus-config-reloader:v0.63.0
      thanosImage:
        # DaoCloud's quay mirror does not expose this tag; the verified
        # Docker Hub mirror contains the same manifest digest as Quay.
        registry: docker.m.daocloud.io
        repository: thanosio/thanos
        tag: v0.30.2
        # Foreign upstream: quay.io/thanos/thanos:v0.30.2
      admissionWebhooks: 
        enabled: false
        patch: 
          enabled: false
      resources:
        limits:
          cpu: "200m"
          memory: "400Mi"
        requests:
          cpu: "100m"
          memory: "400Mi"
    
    prometheus:
      serviceMonitor:
        selfMonitor: false
      prometheusSpec:
        image:
          registry: quay.m.daocloud.io
          repository: prometheus/prometheus
          tag: v2.42.0
          # Foreign upstream: quay.io/prometheus/prometheus:v2.42.0
        retention: 21d
        # Monitoring content is managed by the companion ob-ops Chart and may
        # live in a different namespace without sharing this release label.
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelector: {}
        serviceMonitorNamespaceSelector: {}
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorSelector: {}
        podMonitorNamespaceSelector: {}
        ruleSelectorNilUsesHelmValues: false
        ruleSelector: {}
        ruleNamespaceSelector: {}
        externalLabels:
          clusterDetail: mo-ob-private-cluster
        resources:
          limits:
            cpu: 1000m
            memory: "2Gi"
          requests:
            cpu: 1000m
            memory: "2Gi"
        # [必要]根据部署的云厂商选择存储配置
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: directpv-min-io
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 40Gi
        # Scrape definitions are lifecycle-managed by the ob-ops content Chart.
        additionalScrapeConfigs: []
        alertingEndpoints:
          - name: mo-ob-alertmanager
            # When the release namespace is customized, override this field
            # with the same namespace. The ob-ops installer writes it at
            # runtime from EXISTING_MONITORING_NAMESPACE.
            namespace: mo-ob
            port: 9093
            scheme: http
            pathPrefix: ""
            apiVersion: v2
    
    kube-state-metrics:
      enabled: true
      image:
        registry: m.daocloud.io
        repository: registry.k8s.io/kube-state-metrics/kube-state-metrics
        tag: v2.8.2
        # Foreign upstream: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.8.2
      prometheus:
        monitor:
          enabled: false
      service:
        annotations:
          prometheus.io/scrape: "false"

mo-ruler-stack:
  enabled: true
  dashboards:
    enabled: false
  alertrules:
    enabled: false
  moRuler:
    enabled: false

  managedSecrets:
    alertmanagerWebAuth: false
    alertmanagerEmail: false
    instanceServiceWebhook: false
    grafanaOAuth: false
    grafanaAdmin: false

  # webhook adapter for alertmanger to send alert to wecom
  alertmanagerWebhookAdapter:
    enabled: false
    image:
      # DaoCloud does not expose this optional image. 1ms is a verified public
      # accelerator; production/offline sites should mirror it to customer Harbor.
      repository: docker.1ms.run/ez4bruce3280/alertmanager-webhook-adapter
      tag: v1.1.7
      # Foreign upstream: docker.io/ez4bruce3280/alertmanager-webhook-adapter:v1.1.7

  alertmanager:
    image:
      repository: quay.m.daocloud.io/prometheus/alertmanager
      pullPolicy: IfNotPresent
      tag: v0.27.0
      # Foreign upstream: quay.io/prometheus/alertmanager:v0.27.0
    enabled: true
    service:
      annotations:
        prometheus.io/scrape: "false"
    servicePerReplica:
      annotations:
        prometheus.io/scrape: "false"
    persistence:
      enabled: false
      storageClass: directpv-min-io
    livenessProbe:
      httpGet:
        httpHeaders: []
    readinessProbe:
      httpGet:
        httpHeaders: []
    config:
      # The bundled standalone Alertmanager intentionally uses a null receiver.
      # Keep ob-ops notifications disabled with this base. Notifications require
      # a separately managed Operator Alertmanager that selects AlertmanagerConfig.
      global: {}
      route:
        group_by: ["alertname"] # 分组标签
        group_wait: 10s # 告警等待时间。告警产生后等待10s，如果有同组告警一起发出
        group_interval: 10s # 两组告警的间隔时间
        repeat_interval: 1d # 重复告警的间隔时间，可减少相同邮件的发送频率
        receiver: "null"
        # routes: 
      receivers:
        - name: "null"

    # The bundled standalone Alertmanager has no notification credentials.
    # Do not mount site-specific notification Secrets into this base profile.
    extraSecretMounts: []
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 32Mi

  grafana:
    rbac:
      namespaced: true
    testFramework:
      enabled: false
    image:
      repository: docker.m.daocloud.io/grafana/grafana
      tag: 10.1.6
      # Foreign upstream: docker.io/grafana/grafana:10.1.6
    serviceMonitor:
      enabled: false
    extraSecretMounts: []
    initChownData: 
      enabled: false
      image:
        repository: docker.m.daocloud.io/library/busybox
        tag: 1.31.1
        # Foreign upstream: docker.io/library/busybox:1.31.1
    sidecar: 
      image:
        repository: docker.m.daocloud.io/kiwigrid/k8s-sidecar
        tag: 2.8.1
        # Foreign upstream: docker.io/kiwigrid/k8s-sidecar:2.8.1
      dashboards:
        # Keep these fields aligned with the ob-ops Dashboard ConfigMaps.
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        folderAnnotation: grafana_folder
        # k8s-sidecar 2.8.1 keeps the folder map during list reconciliation,
        # so bulk Helm deletes converge even if individual watch events are lost.
        watchMethod: SLEEP
        env:
          SLEEP_TIME: "10"
        # Grafana's file provider reconciles every 30s.
        skipReload: true
        provider:
          foldersFromFilesStructure: true
      datasources:
        # Do not grant the Grafana ServiceAccount cluster-wide Secret access.
        searchNamespace: null
      
    replicas: 1
    enabled: true
    resources: 
      limits: 
        cpu:    "500m"
        memory: "1Gi"
      requests: 
        cpu:    "200m"
        memory: "1Gi"
    
    persistence: 
      enabled:          true
      type:             "statefulset"
      storageClassName: directpv-min-io
      size:             "5Gi"
    
    admin:
      # Create this Secret in the release namespace before installing.
      existingSecret: mo-ob-grafana-admin
      userKey: admin-user
      passwordKey: admin-password

    grafana.ini:
      auth.generic_oauth:
        enabled: false
    
    service:
      enabled: true
      # Keep the customer default private. Configure NodePort, LoadBalancer or
      # Grafana ingress explicitly in the site values when required.
      type: ClusterIP
      targetPort: 3000
      annotations: {}
      labels: {}
      portName: service
      # Adds the appProtocol field to the service. This allows to work with istio protocol selection. Ex: "http" or "tcp"
      appProtocol: ""
