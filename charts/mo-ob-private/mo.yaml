# Optional high-capacity profile. Do not use this file without sizing it for
# the customer environment. External object-storage credentials are read from
# the namespace-local mo-ob-loki-s3 Secret. This file is intentionally
# image-source neutral; apply values-images-domestic.yaml (recommended) or
# values-images-upstream.yaml after it.
mo-ob-opensource:

  victoria-metrics-k8s-stack:
    enabled: false

  alloy:
    serviceMonitor:
      enabled: false
    alloy:
      resources: 
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 200m
          memory: 200Mi

  promtail:
    serviceMonitor:
      enabled: false
    resources:
      limits:
        cpu: "200m"
        memory: "200Mi"
      requests:
        cpu: "100m"
        memory: "200Mi"
  loki:
    enabled: true
    monitoring:
      dashboards:
        enabled: false
      rules:
        enabled: false
      serviceMonitor:
        enabled: false
    tableManager:
      # TSDB v13 uses the compactor for retention instead of table-manager.
      enabled: false
    # MinIO/S3 is deployed independently from this chart.
    minio:
      enabled: false
    memberlist:
      service:
        # Make member discovery resolvable while Loki pods are becoming ready.
        publishNotReadyAddresses: true

    loki:
      # disable log alert in paivate env
      rulerConfig: 
        storage: 
          type: ""  
      # commonConfig:
      #   replication_factor: 1
      storage_config:
        object_prefix: loki-controlplane
        # Keep index-gateway discovery independent of namespace and cluster DNS.
        boltdb_shipper:
          index_gateway_client:
            server_address: dns+loki-backend-headless:9095
        tsdb_shipper:
          index_gateway_client:
            server_address: dns+loki-backend-headless:9095
      storage:
        bucketNames:
          chunks: ${LOKI_S3_BUCKET}
          ruler: ${LOKI_S3_BUCKET}
          admin: ${LOKI_S3_BUCKET}
        type: s3
        s3:
          endpoint: ${LOKI_S3_ENDPOINT}
          accessKeyId: ${LOKI_S3_ACCESS_KEY}
          secretAccessKey: ${LOKI_S3_SECRET_KEY}
          s3ForcePathStyle: ${LOKI_S3_FORCE_PATH_STYLE}
          insecure: ${LOKI_S3_INSECURE}
      limits_config:
        retention_period: 720h
      compactor:
        retention_enabled: true
        delete_request_store: s3

    write:
      # -- Number of replicas for the write
      replicas: 3
      extraArgs:
        - -config.expand-env=true
      extraEnvFrom:
        - secretRef:
            name: mo-ob-loki-s3
      persistence:
        enableStatefulSetAutoDeletePVC: false
        size: 20Gi
      resources:
        requests:
          memory: "2Gi"
          cpu: "500m"
        limits:
          memory: "2Gi"
          cpu: "1000m"

    read:
      replicas: 3
      extraArgs:
        - -common.compactor-grpc-address=
        - -config.expand-env=true
      extraEnvFrom:
        - secretRef:
            name: mo-ob-loki-s3
      persistence:
        enableStatefulSetAutoDeletePVC: true
        size: 20Gi
      resources:
        requests:
          memory: "2Gi"
          cpu: "500m"
        limits:
          memory: "2Gi"
          cpu: "1000m"

    backend:
      replicas: 1
      extraArgs:
        - -config.expand-env=true
      extraEnvFrom:
        - secretRef:
            name: mo-ob-loki-s3
      persistence:
        enableStatefulSetAutoDeletePVC: true
        size: 20Gi
      resources:
        requests:
          memory: "2Gi"
          cpu: "500m"
        limits:
          memory: "2Gi"
          cpu: "1000m"

    # Configuration for the gateway
    gateway:
      enabled: true
      replicas: 1
      deploymentStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
      resources:
        requests:
          memory: "500Mi"
          cpu: "500m"
        limits:
          memory: "1Gi"
          cpu: "1000m"

  kube-prometheus-stack:
    defaultRules:
      create: false
    grafana:
      enabled: false
      forceDeployDashboards: false
    coreDns:
      enabled: false
    kubeApiServer:
      enabled: false
    kubelet:
      enabled: false
    prometheus-node-exporter: 
      prometheus:
        monitor:
          enabled: false
    
    prometheusOperator:
      serviceMonitor:
        selfMonitor: false
    
    prometheus:
      serviceMonitor:
        selfMonitor: false
      prometheusSpec:
        retention: 14d
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelector: {}
        serviceMonitorNamespaceSelector: {}
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorSelector: {}
        podMonitorNamespaceSelector: {}
        ruleSelectorNilUsesHelmValues: false
        ruleSelector: {}
        ruleNamespaceSelector: {}
        externalLabels:
          clusterDetail: mo-ob-private-cluster
        resources:
          limits:
            cpu: 2000m
            memory: "6Gi"
          requests:
            cpu: 2000m
            memory: "6Gi"
        # [必要]根据部署的云厂商选择存储配置
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 100Gi

    kube-state-metrics:
      enabled: true
      prometheus:
        monitor:
          enabled: false
      service:
        annotations:
          prometheus.io/scrape: "false"


mo-ruler-stack:

  alertmanager:
    service:
      annotations:
        prometheus.io/scrape: "false"
    servicePerReplica:
      annotations:
        prometheus.io/scrape: "false"

  grafana:
    serviceMonitor:
      enabled: false
    initChownData: 
      enabled: false
    sidecar: 
      dashboards:
        # Keep these fields aligned with the ob-ops Dashboard ConfigMaps.
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        folderAnnotation: grafana_folder
        # Periodic list reconciliation guarantees convergence after bulk deletes.
        watchMethod: SLEEP
        env:
          SLEEP_TIME: "10"
        skipReload: true
        provider:
          foldersFromFilesStructure: true

    persistence: 
      enabled:          true
      type:             "statefulset"
      size:             "5Gi"
    resources: 
      limits: 
        cpu:    "1000m"
        memory: "2Gi"
      requests: 
        cpu:    "1000m"
        memory: "2Gi"
    service:
      enabled: true
      type: ClusterIP
      targetPort: 3000
      annotations: {}
      portName: service
