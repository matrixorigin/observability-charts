mo-ob-opensource:

  alloy:
    serviceMonitor:
      enabled: false
    image:
      registry: "docker.io"
      repository: grafana/alloy
      tag: v1.3.1
    alloy:
      resources: 
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 200m
          memory: 200Mi

  promtail:
    serviceMonitor:
      enabled: false
    image:
      registry: docker.io
      repository: grafana/promtail
      tag: "2.8.4"
    resources:
      limits:
        cpu: "200m"
        memory: "200Mi"
      requests:
        cpu: "100m"
        memory: "200Mi"
  loki:
    sidecar: 
      image:
        repository: kiwigrid/k8s-sidecar
        tag: 1.27.5
    image:
      registry: docker.io
      repository: grafana/loki
      tag: "3.2.0"
    enabled: true
    monitoring:
      dashboards:
        enabled: false
      rules:
        enabled: false
      serviceMonitor:
        enabled: false
    tableManager:
      # TSDB v13 uses the compactor for retention instead of table-manager.
      enabled: false
    minio:
      enabled: true
      mode: standalone
      replicas: 1
      drivesPerNode: 1
      buckets: []
      users: []
      policies: []
      rootUser: mo-ob-loki
      rootPassword: mo-ob-loki-change-me
      image:
        repository: quay.io/minio/minio
        tag: RELEASE.2022-09-17T00-09-45Z
      mcImage:
        repository: quay.io/minio/mc
        tag: RELEASE.2022-09-16T09-16-47Z
      persistence:
        enabled: true
        storageClass: ""
        size: 20Gi
    memberlist:
      service:
        # Make member discovery resolvable while Loki pods are becoming ready.
        publishNotReadyAddresses: true

    loki:
      # disable log alert in paivate env
      rulerConfig: 
        storage: 
          type: ""  
      # commonConfig:
      #   replication_factor: 1
      storage_config:
        object_prefix: loki-controlplane
        # Keep index-gateway discovery independent of namespace and cluster DNS.
        boltdb_shipper:
          index_gateway_client:
            server_address: dns+loki-backend-headless:9095
        tsdb_shipper:
          index_gateway_client:
            server_address: dns+loki-backend-headless:9095
      storage:
        bucketNames:
          chunks: chunks
        type: s3
        s3:
          # Used only when minio.enabled=false.
          endpoint: ""
          accessKeyId: ""
          secretAccessKey: ""
          s3ForcePathStyle: true
          insecure: true
      limits_config:
        retention_period: 720h
      compactor:
        retention_enabled: true
        delete_request_store: s3

    write:
      # -- Number of replicas for the write
      replicas: 3
      persistence:
        enableStatefulSetAutoDeletePVC: false
        size: 20Gi
        storageClass: 
      resources:
        requests:
          memory: "2Gi"
          cpu: "500m"
        limits:
          memory: "2Gi"
          cpu: "1000m"

    read:
      replicas: 3
      persistence:
        enableStatefulSetAutoDeletePVC: true
        size: 20Gi
        storageClass: 
      resources:
        requests:
          memory: "2Gi"
          cpu: "500m"
        limits:
          memory: "2Gi"
          cpu: "1000m"

    backend:
      replicas: 1
      persistence:
        enableStatefulSetAutoDeletePVC: true
        size: 20Gi
        storageClass: 
      resources:
        requests:
          memory: "2Gi"
          cpu: "500m"
        limits:
          memory: "2Gi"
          cpu: "1000m"

    # Configuration for the gateway
    gateway:
      image:
        registry: docker.io
        repository: nginxinc/nginx-unprivileged
        tag: 1.27-alpine
      enabled: true
      replicas: 1
      deploymentStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
      resources:
        requests:
          memory: "500Mi"
          cpu: "500m"
        limits:
          memory: "1Gi"
          cpu: "1000m"

  kube-prometheus-stack:
    defaultRules:
      create: false
    grafana:
      enabled: false
      forceDeployDashboards: false
    coreDns:
      enabled: false
    kubeApiServer:
      enabled: false
    kubelet:
      enabled: false
    prometheus-node-exporter: 
      image:
        registry: quay.io
        repository: prometheus/node-exporter
        tag: v1.5.0
      prometheus:
        monitor:
          enabled: false
    
    prometheusOperator:
      serviceMonitor:
        selfMonitor: false
      image: 
        registry: quay.io
        repository: prometheus-operator/prometheus-operator
        tag: v0.63.0
      prometheusConfigReloader: 
        image:
          registry: quay.io
          repository: prometheus-operator/prometheus-config-reloader
          # if not set appVersion field from Chart.yaml is used
          tag: v0.63.0
    
    prometheus:
      serviceMonitor:
        selfMonitor: false
      prometheusSpec:
        image:
          registry: quay.io
          repository: prometheus/prometheus
          tag: v2.42.0
        retention: 14d
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelector: {}
        serviceMonitorNamespaceSelector: {}
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorSelector: {}
        podMonitorNamespaceSelector: {}
        ruleSelectorNilUsesHelmValues: false
        ruleSelector: {}
        ruleNamespaceSelector: {}
        externalLabels:
          clusterDetail: mo-ob-private-cluster
        resources:
          limits:
            cpu: 2000m
            memory: "6Gi"
          requests:
            cpu: 2000m
            memory: "6Gi"
        # [必要]根据部署的云厂商选择存储配置
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ""
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 100Gi

    kube-state-metrics:
      enabled: true
      image:
        registry: registry.k8s.io
        repository: kube-state-metrics/kube-state-metrics
        tag: v2.8.2
      prometheus:
        monitor:
          enabled: false
      service:
        annotations:
          prometheus.io/scrape: "false"


mo-ruler-stack:

  alertmanager:
    image:
      repository: quay.io/prometheus/alertmanager
      pullPolicy: IfNotPresent
      tag: v0.27.0
    service:
      annotations:
        prometheus.io/scrape: "false"
    servicePerReplica:
      annotations:
        prometheus.io/scrape: "false"

  grafana:
    image:
      repository: docker.io/grafana/grafana
      tag: 10.1.6
    serviceMonitor:
      enabled: false
    initChownData: 
      enabled: false
      image:
        repository: docker.io/library/busybox
        tag: 1.31.1
    sidecar: 
      image:
        repository: docker.io/kiwigrid/k8s-sidecar
        tag: 2.8.1
      dashboards:
        # Periodic list reconciliation guarantees convergence after bulk deletes.
        watchMethod: SLEEP
        env:
          SLEEP_TIME: "10"
        skipReload: true
        provider:
          foldersFromFilesStructure: true

    persistence: 
      enabled:          true
      type:             "statefulset"
      storageClassName: 
      size:             "5Gi"
    resources: 
      limits: 
        cpu:    "1000m"
        memory: "2Gi"
      requests: 
        cpu:    "1000m"
        memory: "2Gi"
    service:
      enabled: true
      type: NodePort
      targetPort: 3000
      portName: service
