# CloudNativePG Operator 0.29.0 / 1.30.0 国外原始镜像配置。
# 仅在客户现场能够稳定访问 ghcr.io 时使用。
fullnameOverride: mo-ob-postgresql-operator

image:
  repository: ghcr.io/cloudnative-pg/cloudnative-pg
  tag: 1.30.0
  pullPolicy: IfNotPresent
  # 国内镜像：ghcr.m.daocloud.io/cloudnative-pg/cloudnative-pg:1.30.0

config:
  clusterWide: false

replicaCount: 2

monitoring:
  podMonitorEnabled: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: cloudnative-pg
            app.kubernetes.io/instance: mo-ob-postgresql-operator
        topologyKey: kubernetes.io/hostname
