{{- if and
  .Values.serviceAccount.kubeStateMetrics.handle
  (index .Values "kube-prometheus-stack" "enabled")
  (index .Values "kube-prometheus-stack" "kube-state-metrics" "enabled")
-}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default "mo-ob-opensource-kube-state-metrics" .Values.serviceAccount.kubeStateMetrics.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mo-ob-opensource.labels" . | indent 4 }}
{{- end -}}
