grafana:
  enabled: true


alertmanager:
  enabled: true
  fullnameOverride: "mo-ob-alertmanager"


moRuler:
  # if deploy in control-plane, set to false
  enabled: false
  replicaCount: 1
  image:
    repository: matrixone-cloud/observability
    tag: mo-ruler-local
    pullPolicy: IfNotPresent
  
  rulerSpec:
    secret: mo-ob-secret
    ruler:
      mo:
        # Read MO_HOST, MO_PORT, MO_USER and MO_PASSWORD from mo-ob-secret.
        type: env
        labels:
          matrixone.cloud/role: observability
        host: ""
        port: 6001
        user: ""
        password: ""
