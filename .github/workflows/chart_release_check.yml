name: Chart Release Check

on:
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    branches:
    - main
    - '[0-9]+.[0-9]+.[0-9]+'
    paths:
    - 'charts/**'
    - '.github/workflows/chart_release_check.yml'
    - '.github/workflows/release_chart.yml'

permissions:
  contents: read

jobs:
  release_check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@93ea575cb5d8a053eaa0ac8fa3b40d7e05a33cc8 # tag=v3.1.0
        with:
          fetch-depth: 0

      - name: Copy rules file for ob-opensource
        run: |
          set -euo pipefail
          rm -rf charts/mo-ob-opensource/rules
          cp -R charts/mo-ruler-stack/rules charts/mo-ob-opensource/rules

      - name: Configure Helm repositories
        run: |
          set -euo pipefail
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add victoriametrics https://victoriametrics.github.io/helm-charts
          helm repo add fluent https://fluent.github.io/helm-charts
          helm repo add ckotzbauer https://ckotzbauer.github.io/helm-charts
          helm repo add cnpg https://cloudnative-pg.github.io/charts
          helm repo update

      - name: Build and lint all Helm charts
        shell: bash
        run: |
          set -euo pipefail

          CHART_DIRS=(
            charts/mo-agent-stack
            charts/mo-ob-opensource
            charts/mo-ruler-stack
            charts/mo-ob-private
          )

          for CHART_DIR in "${CHART_DIRS[@]}"; do
            echo "Building dependencies: ${CHART_DIR}"
            helm dependency update "${CHART_DIR}"

            echo "Linting: ${CHART_DIR}"
            helm lint "${CHART_DIR}"
          done

          helm template mo-ob-private charts/mo-ob-private \
            --namespace mo-ob \
            --kube-version 1.34.3 \
            --api-versions policy/v1/PodDisruptionBudget \
            >"${RUNNER_TEMP}/mo-ob-private-rendered.yaml"

          test "$(
            grep -c '^kind: ServiceMonitor$' \
              "${RUNNER_TEMP}/mo-ob-private-rendered.yaml" ||
              true
          )" -eq 0

          test "$(
            grep -c '^kind: PodMonitor$' \
              "${RUNNER_TEMP}/mo-ob-private-rendered.yaml" ||
              true
          )" -eq 0

          test "$(
            grep -c '^kind: PrometheusRule$' \
              "${RUNNER_TEMP}/mo-ob-private-rendered.yaml" ||
              true
          )" -eq 0

          for KIND in Cluster ScheduledBackup; do
            test "$(
              grep -c "^kind: ${KIND}$" \
                "${RUNNER_TEMP}/mo-ob-private-rendered.yaml" ||
                true
            )" -eq 0
          done

          # The base render currently creates Loki write/backend, Prometheus
          # and Grafana persistent storage. Do not fall back to an implicit
          # cluster default StorageClass.
          test "$(
            grep -Ec \
              '^[[:space:]]+storageClass(Name)?: directpv-min-io$' \
              "${RUNNER_TEMP}/mo-ob-private-rendered.yaml" || true
          )" -eq 4

          CUSTOMER_RENDERED="${RUNNER_TEMP}/mo-ob-private-customer-ha.yaml"

          helm template mo-ob-private charts/mo-ob-private \
            --namespace mo-ob \
            --kube-version 1.34.3 \
            --api-versions policy/v1/PodDisruptionBudget \
            --values charts/mo-ob-private/values-customer-ha.yaml.example \
            --values charts/mo-ob-private/values-images-domestic.yaml \
            --set customerSizingApproved=true \
            >"${CUSTOMER_RENDERED}"

          CUSTOMER_UPSTREAM_RENDERED="${RUNNER_TEMP}/mo-ob-private-customer-upstream.yaml"

          helm template mo-ob-private charts/mo-ob-private \
            --namespace mo-ob \
            --kube-version 1.34.3 \
            --api-versions policy/v1/PodDisruptionBudget \
            --values charts/mo-ob-private/values-customer-ha.yaml.example \
            --values charts/mo-ob-private/values-images-upstream.yaml \
            --set customerSizingApproved=true \
            >"${CUSTOMER_UPSTREAM_RENDERED}"

          LEGACY_CUSTOMER_RENDERED="${RUNNER_TEMP}/mo-ob-private-customer-legacy.yaml"

          helm template mo-ob-private charts/mo-ob-private \
            --namespace mo-ob \
            --kube-version 1.34.3 \
            --api-versions policy/v1/PodDisruptionBudget \
            --values charts/mo-ob-private/values-customer.yaml.example \
            --values charts/mo-ob-private/values-images-domestic.yaml \
            --set customerSizingApproved=true \
            >"${LEGACY_CUSTOMER_RENDERED}"

          cmp "${CUSTOMER_RENDERED}" "${LEGACY_CUSTOMER_RENDERED}"

          STANDARD_RENDERED="${RUNNER_TEMP}/mo-ob-private-customer-standard.yaml"
          STANDARD_UPSTREAM_RENDERED="${RUNNER_TEMP}/mo-ob-private-customer-standard-upstream.yaml"

          helm template mo-ob-private charts/mo-ob-private \
            --namespace mo-ob \
            --kube-version 1.34.3 \
            --api-versions policy/v1/PodDisruptionBudget \
            --values charts/mo-ob-private/values-customer-standard.yaml.example \
            --values charts/mo-ob-private/values-images-domestic.yaml \
            --set customerSizingApproved=true \
            >"${STANDARD_RENDERED}"

          helm template mo-ob-private charts/mo-ob-private \
            --namespace mo-ob \
            --kube-version 1.34.3 \
            --api-versions policy/v1/PodDisruptionBudget \
            --values charts/mo-ob-private/values-customer-standard.yaml.example \
            --values charts/mo-ob-private/values-images-upstream.yaml \
            --set customerSizingApproved=true \
            >"${STANDARD_UPSTREAM_RENDERED}"

          for STANDARD_FILE in "${STANDARD_RENDERED}" "${STANDARD_UPSTREAM_RENDERED}"; do
            for KIND in Cluster ScheduledBackup; do
              test "$(grep -c "^kind: ${KIND}$" "${STANDARD_FILE}" || true)" -eq 0
            done
            grep -q 'nodePort: 30081' "${STANDARD_FILE}"

            # Standard currently renders five persistent-storage declarations:
            # Loki write/backend, Prometheus, Alertmanager and Grafana. Every
            # one must use the delivery-default DirectPV StorageClass.
            test "$(
              grep -Ec \
                '^[[:space:]]+storageClass(Name)?: directpv-min-io$' \
                "${STANDARD_FILE}" || true
            )" -eq 5
          done

          # HA adds the CloudNativePG storage declaration. The legacy customer
          # alias must remain byte-for-byte equivalent to the explicit HA file.
          for HA_FILE in "${CUSTOMER_RENDERED}" "${CUSTOMER_UPSTREAM_RENDERED}" \
            "${LEGACY_CUSTOMER_RENDERED}"; do
            test "$(
              grep -Ec \
                '^[[:space:]]+storageClass(Name)?: directpv-min-io$' \
                "${HA_FILE}" || true
            )" -eq 6
          done

          grep -q \
            'resolver kube-dns.kube-system.svc.cluster.local.;' \
            "${STANDARD_RENDERED}"

          STANDARD_COREDNS_RENDERED="${RUNNER_TEMP}/mo-ob-private-customer-standard-coredns.yaml"

          helm template mo-ob-private charts/mo-ob-private \
            --namespace mo-ob \
            --kube-version 1.34.3 \
            --api-versions policy/v1/PodDisruptionBudget \
            --values charts/mo-ob-private/values-customer-standard.yaml.example \
            --values charts/mo-ob-private/values-images-domestic.yaml \
            --set customerSizingApproved=true \
            --set mo-ob-opensource.loki.global.dnsService=coredns \
            >"${STANDARD_COREDNS_RENDERED}"

          grep -q \
            'resolver coredns.kube-system.svc.cluster.local.;' \
            "${STANDARD_COREDNS_RENDERED}"

          if grep -Eq \
            "(^|[[:space:]=\"'])(docker\\.io|quay\\.io|ghcr\\.io|registry\\.k8s\\.io)/" \
            "${STANDARD_RENDERED}"; then
            echo 'Domestic Standard render contains a foreign upstream registry'
            exit 1
          fi

          for KIND in ServiceMonitor PodMonitor PrometheusRule; do
            test "$(
              grep -c "^kind: ${KIND}$" "${CUSTOMER_RENDERED}" ||
                true
            )" -eq 0
          done

          if grep -q '^apiVersion: policy/v1beta1$' "${CUSTOMER_RENDERED}"; then
            echo 'Customer HA render contains an obsolete PDB API version'
            exit 1
          fi

          assert_document_line() {
            local kind="$1"
            local name="$2"
            local expected="$3"
            local rendered="${4:-${CUSTOMER_RENDERED}}"

            awk \
              -v kind="${kind}" \
              -v name="${name}" \
              -v expected="${expected}" '
                BEGIN { RS = "---"; found = 0 }
                {
                  has_kind = 0
                  has_name = 0
                  has_expected = 0
                  line_count = split($0, lines, "\n")

                  for (line = 1; line <= line_count; line++) {
                    if (lines[line] == "kind: " kind) {
                      has_kind = 1
                    }
                    if (lines[line] == "  name: " name) {
                      has_name = 1
                    }
                    if (lines[line] == expected) {
                      has_expected = 1
                    }
                  }

                  if (has_kind && has_name && has_expected) {
                    found = 1
                  }
                }
                END { exit found ? 0 : 1 }
              ' "${rendered}"
          }

          assert_document_sequence() {
            local kind="$1"
            local name="$2"
            local first="$3"
            local second="$4"
            local rendered="${5:-${CUSTOMER_RENDERED}}"

            awk \
              -v kind="${kind}" \
              -v name="${name}" \
              -v first="${first}" \
              -v second="${second}" '
                BEGIN { RS = "---"; found = 0 }
                {
                  has_kind = 0
                  has_name = 0
                  has_sequence = 0
                  line_count = split($0, lines, "\n")

                  for (line = 1; line <= line_count; line++) {
                    if (lines[line] == "kind: " kind) {
                      has_kind = 1
                    }
                    if (lines[line] == "  name: " name) {
                      has_name = 1
                    }
                    if (lines[line] == first && lines[line + 1] == second) {
                      has_sequence = 1
                    }
                  }

                  if (has_kind && has_name && has_sequence) {
                    found = 1
                  }
                }
                END { exit found ? 0 : 1 }
              ' "${rendered}"
          }

          assert_render_contains() {
            local rendered="$1"
            local expected="$2"

            if ! grep -Fq "${expected}" "${rendered}"; then
              echo "Rendered manifest is missing image: ${expected}"
              exit 1
            fi
          }

          DOMESTIC_IMAGES=(
            'docker.m.daocloud.io/grafana/alloy:v1.3.1'
            'docker.m.daocloud.io/grafana/promtail:2.8.4'
            'docker.m.daocloud.io/grafana/loki:3.2.0'
            'docker.m.daocloud.io/kiwigrid/k8s-sidecar:1.27.5'
            'docker.m.daocloud.io/nginxinc/nginx-unprivileged:1.27-alpine'
            'quay.m.daocloud.io/prometheus/node-exporter:v1.5.0'
            'quay.m.daocloud.io/prometheus-operator/prometheus-operator:v0.63.0'
            'quay.m.daocloud.io/prometheus-operator/prometheus-config-reloader:v0.63.0'
            'docker.m.daocloud.io/thanosio/thanos:v0.30.2'
            'quay.m.daocloud.io/prometheus/prometheus:v2.42.0'
            'm.daocloud.io/registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.8.2'
            'quay.m.daocloud.io/prometheus/alertmanager:v0.27.0'
            'docker.m.daocloud.io/kiwigrid/k8s-sidecar:2.8.1'
            'docker.m.daocloud.io/grafana/grafana:10.1.6'
            'ghcr.m.daocloud.io/cloudnative-pg/postgresql:17.10-202608030910-system-bookworm@sha256:8561d04754c2caf8ed203b52e96163a24ff045782ca726d01b01bbcb0649222c'
          )

          for IMAGE in "${DOMESTIC_IMAGES[@]}"; do
            assert_render_contains "${CUSTOMER_RENDERED}" "${IMAGE}"
          done

          if grep -Eq \
            "(^|[[:space:]=\"'])(docker\\.io|quay\\.io|ghcr\\.io|registry\\.k8s\\.io)/" \
            "${CUSTOMER_RENDERED}"; then
            echo 'Domestic render contains a foreign upstream registry'
            grep -En \
              "(^|[[:space:]=\"'])(docker\\.io|quay\\.io|ghcr\\.io|registry\\.k8s\\.io)/" \
              "${CUSTOMER_RENDERED}"
            exit 1
          fi

          UPSTREAM_IMAGES=(
            'docker.io/grafana/alloy:v1.3.1'
            'docker.io/grafana/promtail:2.8.4'
            'docker.io/grafana/loki:3.2.0'
            'docker.io/kiwigrid/k8s-sidecar:1.27.5'
            'docker.io/nginxinc/nginx-unprivileged:1.27-alpine'
            'quay.io/prometheus/node-exporter:v1.5.0'
            'quay.io/prometheus-operator/prometheus-operator:v0.63.0'
            'quay.io/prometheus-operator/prometheus-config-reloader:v0.63.0'
            'quay.io/thanos/thanos:v0.30.2'
            'quay.io/prometheus/prometheus:v2.42.0'
            'registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.8.2'
            'quay.io/prometheus/alertmanager:v0.27.0'
            'docker.io/kiwigrid/k8s-sidecar:2.8.1'
            'docker.io/grafana/grafana:10.1.6'
            'ghcr.io/cloudnative-pg/postgresql:17.10-202608030910-system-bookworm@sha256:8561d04754c2caf8ed203b52e96163a24ff045782ca726d01b01bbcb0649222c'
          )

          for IMAGE in "${UPSTREAM_IMAGES[@]}"; do
            assert_render_contains "${CUSTOMER_UPSTREAM_RENDERED}" "${IMAGE}"
          done

          if grep -Eq '(m\.daocloud\.io|docker\.1ms\.run)' \
            "${CUSTOMER_UPSTREAM_RENDERED}"; then
            echo 'Upstream render contains a domestic mirror registry'
            grep -En '(m\.daocloud\.io|docker\.1ms\.run)' \
              "${CUSTOMER_UPSTREAM_RENDERED}"
            exit 1
          fi

          grep -Fqx 'imageSource: domestic' \
            charts/mo-ob-private/values-customer.yaml.example
          grep -Fqx 'imageSource: domestic' \
            charts/mo-ob-private/values-images-domestic.yaml
          grep -Fqx 'imageSource: upstream' \
            charts/mo-ob-private/values-images-upstream.yaml

          for OPTIONAL_DOMESTIC_IMAGE in \
            'docker.1ms.run/ez4bruce3280/alertmanager-webhook-adapter' \
            'docker.m.daocloud.io/library/busybox'; do
            grep -Fq "${OPTIONAL_DOMESTIC_IMAGE}" \
              charts/mo-ob-private/values-images-domestic.yaml
          done

          for OPTIONAL_UPSTREAM_IMAGE in \
            'docker.io/ez4bruce3280/alertmanager-webhook-adapter' \
            'docker.io/library/busybox'; do
            grep -Fq "${OPTIONAL_UPSTREAM_IMAGE}" \
              charts/mo-ob-private/values-images-upstream.yaml
          done

          CNPG_DOMESTIC_RENDERED="${RUNNER_TEMP}/cnpg-operator-domestic.yaml"
          CNPG_UPSTREAM_RENDERED="${RUNNER_TEMP}/cnpg-operator-upstream.yaml"

          helm template mo-ob-postgresql-operator cnpg/cloudnative-pg \
            --version 0.29.0 \
            --namespace mo-ob \
            --values charts/mo-ob-private/cnpg-operator-values-domestic.yaml \
            >"${CNPG_DOMESTIC_RENDERED}"

          helm template mo-ob-postgresql-operator cnpg/cloudnative-pg \
            --version 0.29.0 \
            --namespace mo-ob \
            --values charts/mo-ob-private/cnpg-operator-values-upstream.yaml \
            >"${CNPG_UPSTREAM_RENDERED}"

          assert_render_contains "${CNPG_DOMESTIC_RENDERED}" \
            'ghcr.m.daocloud.io/cloudnative-pg/cloudnative-pg:1.30.0'
          assert_render_contains "${CNPG_UPSTREAM_RENDERED}" \
            'ghcr.io/cloudnative-pg/cloudnative-pg:1.30.0'

          if grep -Fq 'ghcr.io/cloudnative-pg/' "${CNPG_DOMESTIC_RENDERED}"; then
            echo 'Domestic CloudNativePG Operator render contains ghcr.io'
            exit 1
          fi

          if grep -Fq 'ghcr.m.daocloud.io/' "${CNPG_UPSTREAM_RENDERED}"; then
            echo 'Upstream CloudNativePG Operator render contains a domestic mirror'
            exit 1
          fi

          assert_document_line StatefulSet loki-write '  replicas: 3'
          assert_document_line StatefulSet loki-backend '  replicas: 3'
          assert_document_line Deployment loki-read '  replicas: 2'
          assert_document_line Deployment mo-ob-private-loki-gateway '  replicas: 2'
          assert_document_line StatefulSet mo-ob-alertmanager '  replicas: 3'
          assert_document_line StatefulSet mo-ob-private-grafana '  replicas: 2'
          assert_document_line Prometheus \
            mo-ob-private-kube-prometh-prometheus \
            '  replicas: 2'
          assert_document_line Cluster mo-ob-postgresql \
            '  instances: 3'
          assert_document_line Cluster mo-ob-postgresql \
            '    helm.sh/resource-policy: keep'
          assert_document_line Cluster mo-ob-postgresql \
            '  imageName: ghcr.m.daocloud.io/cloudnative-pg/postgresql:17.10-202608030910-system-bookworm@sha256:8561d04754c2caf8ed203b52e96163a24ff045782ca726d01b01bbcb0649222c'
          assert_document_line Cluster mo-ob-postgresql \
            '  enablePDB: true'
          assert_document_line Cluster mo-ob-postgresql \
            '  enableSuperuserAccess: false'
          assert_document_line Cluster mo-ob-postgresql \
            '    enablePodAntiAffinity: true'
          assert_document_line Cluster mo-ob-postgresql \
            '    podAntiAffinityType: required'
          assert_document_line Cluster mo-ob-postgresql \
            '    topologyKey: kubernetes.io/hostname'
          assert_document_line Cluster mo-ob-postgresql \
            '    size: 20Gi'
          assert_document_line Cluster mo-ob-postgresql \
            '          name: mo-ob-postgresql-backup-s3'
          assert_document_line ScheduledBackup \
            mo-ob-postgresql-daily-backup \
            '  schedule: "0 0 2 * * *"'

          assert_document_line PodDisruptionBudget \
            mo-ob-private-kube-prometh-prometheus \
            '  minAvailable: 1'
          assert_document_line PodDisruptionBudget loki-backend \
            '  maxUnavailable: 1'
          assert_document_line PodDisruptionBudget mo-ob-private-loki-gateway \
            '  maxUnavailable: 1'
          assert_document_line PodDisruptionBudget loki-read \
            '  maxUnavailable: 1'
          assert_document_line PodDisruptionBudget loki-write \
            '  maxUnavailable: 1'
          assert_document_line PodDisruptionBudget mo-ob-alertmanager \
            '  minAvailable: 2'
          assert_document_line PodDisruptionBudget mo-ob-private-grafana \
            '  minAvailable: 1'

          assert_document_line ConfigMap \
            mo-ob-private-grafana-config-dashboards \
            '          foldersFromFilesStructure: true'
          assert_document_sequence StatefulSet mo-ob-private-grafana \
            '            - name: LABEL_VALUE' \
            '              value: "1"'
          assert_document_sequence StatefulSet mo-ob-private-grafana \
            '            - name: FOLDER_ANNOTATION' \
            '              value: "grafana_folder"'
          assert_document_sequence StatefulSet mo-ob-private-grafana \
            '                  key: password' \
            '                  name: mo-ob-postgresql-app'
          assert_document_sequence StatefulSet mo-ob-private-grafana \
            '                  key: GF_SECURITY_SECRET_KEY' \
            '                  name: mo-ob-postgresql-app'
          assert_document_sequence StatefulSet mo-ob-private-grafana \
            '            - name: "GF_DATABASE_HOST"' \
            '              value: "mo-ob-postgresql-rw:5432"'
          assert_document_sequence StatefulSet loki-write \
            '            - secretRef:' \
            '                name: mo-ob-loki-s3'
          assert_document_sequence Deployment loki-read \
            '            - secretRef:' \
            '                name: mo-ob-loki-s3'
          assert_document_sequence StatefulSet loki-backend \
            '            - secretRef:' \
            '                name: mo-ob-loki-s3'
          assert_document_sequence StatefulSet mo-ob-private-grafana \
            '                  name: mo-ob-grafana-admin' \
            '                  key: admin-user'
          assert_document_sequence StatefulSet mo-ob-private-grafana \
            '                  name: mo-ob-grafana-admin' \
            '                  key: admin-password'
          assert_document_line Service mo-ob-private-grafana \
            '  type: NodePort'
          assert_document_line Service mo-ob-private-grafana \
            '      nodePort: 30081'
          assert_document_sequence ConfigMap mo-ob-private-grafana \
            '    [unified_alerting]' \
            '    enabled = false'

          CUSTOMER_PRIVATE_RENDERED="${RUNNER_TEMP}/mo-ob-private-customer-private.yaml"
          PRIVATE_IMAGE='registry.customer.example/postgresql:17.10@sha256:8561d04754c2caf8ed203b52e96163a24ff045782ca726d01b01bbcb0649222c'

          helm template mo-ob-private charts/mo-ob-private \
            --namespace mo-ob \
            --kube-version 1.34.3 \
            --values charts/mo-ob-private/values-customer.yaml.example \
            --set customerSizingApproved=true \
            --set imageSource=private \
            --set-string "postgresql.cluster.imageName=${PRIVATE_IMAGE}" \
            --set 'postgresql.cluster.imagePullSecrets[0].name=harbor-image-secret' \
            --set postgresql.backups.endpointCA.name=mo-ob-postgresql-backup-ca \
            >"${CUSTOMER_PRIVATE_RENDERED}"

          assert_document_line Cluster mo-ob-postgresql \
            "  imageName: ${PRIVATE_IMAGE}" \
            "${CUSTOMER_PRIVATE_RENDERED}"
          assert_document_sequence Cluster mo-ob-postgresql \
            '  imagePullSecrets:' \
            '    - name: harbor-image-secret' \
            "${CUSTOMER_PRIVATE_RENDERED}"
          assert_document_sequence Cluster mo-ob-postgresql \
            '      endpointCA:' \
            '        name: mo-ob-postgresql-backup-ca' \
            "${CUSTOMER_PRIVATE_RENDERED}"

          INVALID_FOLDER_LOG="${RUNNER_TEMP}/invalid-grafana-folder.log"

          if helm lint charts/mo-ob-private \
            --values charts/mo-ob-private/values-customer.yaml.example \
            --set customerSizingApproved=true \
            --set mo-ruler-stack.grafana.sidecar.dashboards.provider.foldersFromFilesStructure=false \
            >"${INVALID_FOLDER_LOG}" 2>&1; then

            echo 'Grafana folder mapping must be rejected when disabled'
            cat "${INVALID_FOLDER_LOG}"
            exit 1
          fi

          INVALID_IMAGE_SOURCE_LOG="${RUNNER_TEMP}/invalid-image-source.log"

          if helm lint charts/mo-ob-private \
            --values charts/mo-ob-private/values-customer.yaml.example \
            --set customerSizingApproved=true \
            --set imageSource=invalid \
            >"${INVALID_IMAGE_SOURCE_LOG}" 2>&1; then

            echo 'An invalid imageSource value was accepted'
            cat "${INVALID_IMAGE_SOURCE_LOG}"
            exit 1
          fi

          assert_invalid_postgresql_value() {
            local set_mode="$1"
            local override="$2"
            local invalid_log="${RUNNER_TEMP}/invalid-postgresql-value.log"

            if helm lint charts/mo-ob-private \
              --values charts/mo-ob-private/values-customer.yaml.example \
              --set customerSizingApproved=true \
              "${set_mode}" "${override}" \
              >"${invalid_log}" 2>&1; then

              echo "Invalid PostgreSQL value was accepted: ${override}"
              cat "${invalid_log}"
              exit 1
            fi
          }

          assert_invalid_postgresql_value \
            --set-string postgresql.backups.wal.compression=invalid
          assert_invalid_postgresql_value \
            --set postgresql.backups.wal.maxParallel=0
          assert_invalid_postgresql_value \
            --set-string postgresql.backups.data.compression=zstd
          assert_invalid_postgresql_value \
            --set postgresql.backups.data.jobs=0
          assert_invalid_postgresql_value \
            --set-string postgresql.backups.retentionPolicy=forever
          assert_invalid_postgresql_value \
            --set-string 'postgresql.backups.scheduledBackups[0].schedule=* * * * *'
          assert_invalid_postgresql_value \
            --set postgresql.enabled=false

          CUSTOMER_SECRETS_TEMPLATE="charts/mo-ob-private/customer-secrets.yaml.example"
          test -s "${CUSTOMER_SECRETS_TEMPLATE}"
          test "$(grep -c '^kind: Secret$' "${CUSTOMER_SECRETS_TEMPLATE}")" -eq 4

          for REQUIRED_SECRET in \
            mo-ob-loki-s3 \
            mo-ob-grafana-admin \
            mo-ob-postgresql-app \
            mo-ob-postgresql-backup-s3; do

            grep -Fqx "  name: ${REQUIRED_SECRET}" "${CUSTOMER_SECRETS_TEMPLATE}"
          done

          for REQUIRED_KEY in \
            LOKI_S3_ENDPOINT \
            LOKI_S3_BUCKET \
            LOKI_S3_ACCESS_KEY \
            LOKI_S3_SECRET_KEY \
            LOKI_S3_FORCE_PATH_STYLE \
            LOKI_S3_INSECURE \
            admin-user \
            admin-password \
            username \
            password \
            GF_SECURITY_SECRET_KEY \
            ACCESS_KEY_ID \
            ACCESS_SECRET_KEY; do

            grep -Eq "^  ${REQUIRED_KEY}:" "${CUSTOMER_SECRETS_TEMPLATE}"
          done

      - name: Dry-run Helm packaging
        shell: bash
        run: |
          set -euo pipefail

          CHART_DIRS=(
            charts/mo-agent-stack
            charts/mo-ob-opensource
            charts/mo-ruler-stack
            charts/mo-ob-private
          )

          PACKAGE_DIR="${RUNNER_TEMP}/chart-release-check-packages"
          mkdir -p "${PACKAGE_DIR}"

          for CHART_DIR in "${CHART_DIRS[@]}"; do
            CHART_METADATA="$(helm show chart "${CHART_DIR}")"

            CHART_NAME="$(
              awk '/^name:/ { print $2; exit }' \
                <<<"${CHART_METADATA}"
            )"

            CHART_VERSION="$(
              awk '/^version:/ { print $2; exit }' \
                <<<"${CHART_METADATA}"
            )"

            EXPECTED_PACKAGE="${PACKAGE_DIR}/${CHART_NAME}-${CHART_VERSION}.tgz"

            helm package \
              "${CHART_DIR}" \
              --dependency-update \
              --destination "${PACKAGE_DIR}"

            test -s "${EXPECTED_PACKAGE}"
            tar -tzf "${EXPECTED_PACKAGE}" >/dev/null
            helm show chart "${EXPECTED_PACKAGE}" >/dev/null

            if [[ "${CHART_NAME}" == "mo-ob-private" ]]; then
              PACKAGE_CONTENTS="${RUNNER_TEMP}/mo-ob-private-package-contents.txt"
              tar -tzf "${EXPECTED_PACKAGE}" >"${PACKAGE_CONTENTS}"
              grep -Fqx \
                'mo-ob-private/customer-secrets.yaml.example' \
                "${PACKAGE_CONTENTS}"
              grep -Fqx \
                'mo-ob-private/templates/postgresql-cluster.yaml' \
                "${PACKAGE_CONTENTS}"

              for REQUIRED_PROFILE in \
                values-images-domestic.yaml \
                values-images-upstream.yaml \
                cnpg-operator-values-domestic.yaml \
                cnpg-operator-values-upstream.yaml; do

                grep -Fqx \
                  "mo-ob-private/${REQUIRED_PROFILE}" \
                  "${PACKAGE_CONTENTS}"
              done
            fi
          done

          PACKAGE_COUNT="$(
            find "${PACKAGE_DIR}" \
              -maxdepth 1 \
              -type f \
              -name '*.tgz' |
              wc -l |
              tr -d '[:space:]'
          )"

          if [[ "${PACKAGE_COUNT}" -ne "${#CHART_DIRS[@]}" ]]; then
            echo "Expected ${#CHART_DIRS[@]} Chart packages, found ${PACKAGE_COUNT}"
            find "${PACKAGE_DIR}" -maxdepth 1 -type f -print
            exit 1
          fi

          echo "Helm dry-run packages:"
          find "${PACKAGE_DIR}" \
            -maxdepth 1 \
            -type f \
            -name '*.tgz' \
            -print |
            sort

      - name: Run Artifact Hub lint
        run: |
          set -euo pipefail
          echo "https://github.com/artifacthub/hub/releases/download/v1.16.0/ah_1.16.0_linux_amd64.tar.gz" |
            xargs wget -O - |
            tar -xz
          ./ah lint -p charts
          rm -f ./ah
